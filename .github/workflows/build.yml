name: Build official Wan2.2 Animate runtime (code only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install lightweight CPU-only test deps
        run: |
          python3 -m pip install --user Pillow==11.1.0
          python3 -m unittest discover -s tests -v
      - name: Assert no model weights or user footage are tracked
        run: |
          if git ls-files | grep -Ei '(\.(mp4|mov|mkv|jpg|jpeg|png|ckpt|pt|pth|safetensors|onnx|bin)$|(^|/)(input|output|weights)/)'; then
            echo "::error::Unexpected private media/model weights in public repository"
            exit 1
          fi
          python3 scripts/runtime.py plan

  publish:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 130
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require GHCR package PUBLIC before large CUDA upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }} --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "::error::GHCR image is not public ($visibility); refusing large upload to avoid private-package billing."
            exit 1
          fi
          echo "GHCR visibility verified: $visibility"
      - name: Remove preinstalled runner packages to reclaim Docker build space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /usr/local/share/powershell
          sudo apt-get clean
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Official Wan2.2 Animate replacement runtime (pinned source, preinstalled FlashAttention, NO weights/private media)
